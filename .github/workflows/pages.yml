name: Publish Java workbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-notes/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: study-notes
      - name: Build workbook
        run: npm run build
        working-directory: study-notes
      - name: Prepare public files
        run: |
          mkdir .site
          cp study-notes/*.html .site/
          cp study-notes/LICENSE.txt .site/
          cp -R study-notes/assets .site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
